<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#2a78d6">
  <title>Οικογενειακά έξοδα</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Cpath d='M9 22V14M16 22V9M23 22v-5' stroke='white' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">Οικογενειακά έξοδα<small id="updated">&nbsp;</small></div>
      <div class="spacer"></div>
      <div class="month-picker" id="month-picker" hidden>
        <button class="icon-btn" id="prev-month" aria-label="Προηγούμενος μήνας"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <select id="month" aria-label="Μήνας"></select>
        <button class="icon-btn" id="next-month" aria-label="Επόμενος μήνας"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
      </div>
      <button class="icon-btn" id="refresh" aria-label="Ανανέωση" title="Ανανέωση"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <button class="icon-btn" id="open-settings" aria-label="Ρυθμίσεις" title="Ρυθμίσεις"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>

  <div class="tabs-wrap" id="tabs-wrap" hidden>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-view="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Μήνας</button>
      <button class="tab" role="tab" data-view="entries"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Πληρωμές</button>
      <button class="tab" role="tab" data-view="charts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Γραφήματα</button>
      <button class="tab" role="tab" data-view="plans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Πλάνα</button>
    </nav>
  </div>

  <main id="main"></main>

  <button class="fab" id="fab" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Πληρωμή</button>

  <!-- Add / edit payment -->
  <dialog id="entry-dlg">
    <form class="dlg" id="entry-form" method="dialog" novalidate>
      <div class="dlg-head">
        <h2 id="entry-title">Νέα πληρωμή</h2>
        <button type="button" class="icon-btn" data-close aria-label="Κλείσιμο"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <label class="lbl" for="f-amount">Ποσό (€)</label>
      <input class="field amount-input" id="f-amount" inputmode="decimal" autocomplete="off" placeholder="0,00" required>
      <label class="lbl" for="f-category">Κατηγορία</label>
      <select class="field" id="f-category" required></select>
      <div class="form-grid">
        <div>
          <label class="lbl" for="f-date">Ημερομηνία</label>
          <input class="field" id="f-date" type="date" required>
        </div>
        <div>
          <label class="lbl" for="f-desc">Περιγραφή</label>
          <input class="field" id="f-desc" autocomplete="off" list="desc-suggestions" placeholder="π.χ. Lidl">
          <datalist id="desc-suggestions"></datalist>
        </div>
      </div>
      <label class="lbl">Ποιος πλήρωσε</label>
      <div class="seg" id="f-payer"></div>
      <label class="lbl" for="f-comments">Σχόλια</label>
      <input class="field" id="f-comments" autocomplete="off">
      <div class="err" id="entry-err" hidden></div>
      <div class="row-actions">
        <button type="button" class="btn danger" id="entry-delete" hidden>Διαγραφή</button>
        <span class="spacer"></span>
        <button type="submit" class="btn primary" id="entry-save">Αποθήκευση</button>
      </div>
    </form>
  </dialog>

  <!-- Chart editor -->
  <dialog id="chart-dlg">
    <form class="dlg" id="chart-form" method="dialog" novalidate>
      <div class="dlg-head">
        <h2 id="chart-dlg-title">Γράφημα</h2>
        <button type="button" class="icon-btn" data-close aria-label="Κλείσιμο"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <label class="lbl" for="c-title">Τίτλος</label>
      <input class="field" id="c-title" autocomplete="off">
      <div class="form-grid">
        <div><label class="lbl" for="c-group">Ομαδοποίηση ανά</label><select class="field" id="c-group"></select></div>
        <div><label class="lbl" for="c-kind">Είδος</label><select class="field" id="c-kind"></select></div>
        <div><label class="lbl" for="c-period">Περίοδος</label><select class="field" id="c-period"></select></div>
        <div><label class="lbl" for="c-split">Ανάλυση ανά</label><select class="field" id="c-split"></select></div>
      </div>
      <label class="check"><input type="checkbox" id="c-plan"> Δείξε πλάνο ή ταβάνι</label>
      <label class="check"><input type="checkbox" id="c-cum"> Αθροιστικά (για ημέρα ή μήνα)</label>
      <label class="check"><input type="checkbox" id="c-wide"> Φαρδύ γράφημα</label>
      <label class="lbl">Κατηγορίες (καμία επιλογή = όλες)</label>
      <div class="chips" id="c-cats"></div>
      <div class="row-actions">
        <button type="button" class="btn danger" id="chart-delete">Διαγραφή</button>
        <span class="spacer"></span>
        <button type="submit" class="btn primary">Αποθήκευση</button>
      </div>
    </form>
  </dialog>

  <!-- Settings -->
  <dialog id="settings-dlg">
    <form class="dlg" id="settings-form" method="dialog" novalidate>
      <div class="dlg-head">
        <h2>Ρυθμίσεις</h2>
        <button type="button" class="icon-btn" data-close aria-label="Κλείσιμο"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div id="settings-fields"></div>
      <label class="lbl">Εμφάνιση</label>
      <div class="seg" id="theme-seg">
        <button type="button" data-theme-choice="auto">Αυτόματα</button>
        <button type="button" data-theme-choice="light">Φωτεινό</button>
        <button type="button" data-theme-choice="dark">Σκούρο</button>
      </div>
      <div id="share-section">
        <label class="lbl">Άλλη συσκευή</label>
        <button type="button" class="btn" id="share-connect">Σύνδεση άλλης συσκευής (QR code)</button>
        <div id="share-box" class="share-box" hidden>
          <div id="qr" class="qr" aria-label="QR code σύνδεσης"></div>
          <p class="small muted">Σκάναρε με την κάμερα του άλλου κινητού, ή στείλε το link. Το link περιέχει το κλειδί, οπότε στείλ' το μόνο σε δικά σας άτομα.</p>
          <div class="seg">
            <button type="button" id="share-copy">Αντιγραφή link</button>
            <button type="button" id="share-send">Αποστολή…</button>
          </div>
        </div>
      </div>
      <div class="err" id="settings-err" hidden></div>
      <div class="row-actions">
        <button type="button" class="btn danger" id="logout">Αποσύνδεση από αυτή τη συσκευή</button>
        <span class="spacer"></span>
        <button type="submit" class="btn primary">Αποθήκευση</button>
      </div>
    </form>
  </dialog>

  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
